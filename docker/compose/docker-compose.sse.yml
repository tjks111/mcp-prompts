# Server-Sent Events (SSE) transport configuration for MCP Prompts
# This file adds SSE transport support
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

version: '3'

services:
  # Override the base service with SSE configuration
  mcp-prompts:
    image: sparesparrow/mcp-prompts:latest
    container_name: mcp-prompts
    environment:
      - NODE_ENV=production
      - STORAGE_TYPE=filesystem
      - PROMPTS_DIR=/app/data/prompts
      - BACKUPS_DIR=/app/data/backups
      - LOG_LEVEL=info
      - HTTP_SERVER=true
      - PORT=3000 # Standardize internal port to 3000, Nginx proxies to this. Host mapping 3003:3000 is for external access to main API.
      - HOST=0.0.0.0
      - ENABLE_SSE=true
      - SSE_PATH=/events # Standardized SSE_PATH
      - SSE_HEARTBEAT_INTERVAL_MS=30000 # Corrected variable name and sensible default
      - SSE_CLIENT_TIMEOUT_MS=60000 # Added new variable with default
      - SSE_MESSAGE_HISTORY=50 # Added new variable with default
      # - SSE_RECONNECT_TIMEOUT=3000 # Removed, unused by server
      - CORS_ORIGIN=*
    volumes:
      - mcp-prompts-data:/app/data
    ports:
      - "3003:3000"  # HTTP API exposed on host 3003, container runs on 3000
      # - "3010:3010"  # Removed, SSE is on main port via Nginx
    healthcheck:
      test: ["CMD", "/app/scripts/health_check.sh", "localhost", "3000"]
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on: []

  # Nginx service for SSE transport with proper headers and proxy behavior
  nginx-sse:
    image: nginx:latest
    container_name: mcp-prompts-nginx-sse
    volumes:
      - ../nginx/sse.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3011:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp-network
    depends_on:
      - mcp-prompts

networks:
  mcp-network:
    driver: bridge 